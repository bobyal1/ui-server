name: Build Custom UI Server

on:
  workflow_dispatch: # Allows you to trigger this manually with a single click

permissions:
  contents: read

jobs:
  build:
    name: Compile and Embed Custom UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ui-server
        uses: actions/checkout@v4

      # 1. Clone your personal UI fork into a temporary folder
      - name: Checkout Custom UI Fork
        uses: actions/checkout@v4
        with:
          repository: 'bobyal1/ui' # <-- Replace with your GitHub username
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          path: 'custom-ui-source'

      # 2. Setup Node and the LATEST pnpm version to parse the modern workspace schema properly
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Latest pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10  # Explicitly upgrades from v9 to v10 to support modern workspaces

      # 3. Build the frontend server assets from your fork
      - name: Build Frontend Assets
        run: |
          cd custom-ui-source
          # 1. Install dependencies across the workspace properly
          pnpm install
          
          # 2. Build the exact distribution files the Go embedded server targets
          pnpm run build:server


      # 4. Clear default assets and inject your custom compiled assets from Temporal's specific path
      - name: Sync Assets into UI Server
        run: |
          # 1. Clean the target area if it exists
          rm -rf server/ui/assets/
          
          # 2. Re-create the folder structure cleanly to avoid "No such file" errors
          mkdir -p server/ui/assets/
          
          # 3. Copy the compiled assets over
          cp -r custom-ui-source/server/ui/assets/* server/ui/assets/
          
          # 4. Clean up source files before Go build
          rm -rf custom-ui-source 



      # 5. Setup Go to compile the backend server binary
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # Matches Temporal's core requirements

      # 6. Build the pure static Go binary with your UI embedded natively
      - name: Compile Statically Linked UI Server
        run: |
          mkdir -p dist/
          export CGO_ENABLED=0
          go build -v \
            -ldflags="-s -w -extldflags '-static'" \
            -o dist/ui-server \
            ./cmd/server

      # 7. Upload the standalone compiled binary to your workflow run
      - name: Upload Custom UI Server Binary
        uses: actions/upload-artifact@v4
        with:
          name: custom-ui-server-linux-amd64
          path: dist/ui-server
          retention-days: 14
